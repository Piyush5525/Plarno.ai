# Render blueprint for the FastAPI backend (the frontend goes on Vercel, see README > Deploy).
services:
  - type: web
    name: plarno-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --forwarded-allow-ips "*": behind Render's proxy, so the per-IP rate limit sees each visitor, not the proxy
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --forwarded-allow-ips "*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PLARNO_SECRET
        generateValue: true
      - key: PLARNO_CORS            # your Vercel address, exactly, no trailing slash: https://plarno-ai.vercel.app
        sync: false
      - key: PLARNO_ADMIN_EMAILS
        sync: false
      - key: SERP_API
        sync: false
      - key: MAPBOX_API
        sync: false
      - key: WEATHER_API
        sync: false
      - key: AQICN_API
        sync: false
      - key: GEMINI_API
        sync: false
