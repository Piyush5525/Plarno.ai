<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">Plarno.ai</title>
  <desc id="d">Plarno.ai: your journey, intelligently planned. A dashed travel route with a paper plane across a dark gradient.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07172a"/><stop offset="1" stop-color="#0d2b45"/></linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a59"/><stop offset="1" stop-color="#e8412f"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8a5c"/><stop offset=".55" stop-color="#f4553f"/><stop offset="1" stop-color="#f6b73c"/></linearGradient>
    <radialGradient id="g1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f4553f" stop-opacity=".55"/><stop offset="1" stop-color="#f4553f" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#0fa596" stop-opacity=".5"/><stop offset="1" stop-color="#0fa596" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3b9eea" stop-opacity=".4"/><stop offset="1" stop-color="#3b9eea" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#f4553f" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <ellipse cx="1120" cy="40" rx="360" ry="260" fill="url(#g1)"/>
  <ellipse cx="80" cy="330" rx="380" ry="240" fill="url(#g2)"/>
  <ellipse cx="640" cy="360" rx="300" ry="170" fill="url(#g3)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>

  <!-- travel route: dashed path with stops and a plane -->
  <path id="route" d="M690 292 C 800 292, 830 150, 940 170 S 1090 280, 1196 96" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12"/>
  <g>
    <circle cx="690" cy="292" r="9" fill="#0fa596" stroke="#fff" stroke-width="3"/>
    <circle cx="940" cy="170" r="9" fill="#f6b73c" stroke="#fff" stroke-width="3"/>
    <circle cx="1090" cy="262" r="9" fill="#3b9eea" stroke="#fff" stroke-width="3"/>
    <circle cx="1196" cy="96" r="12" fill="#f4553f" stroke="#fff" stroke-width="3"/>
    <circle cx="1196" cy="96" r="12" fill="none" stroke="#f4553f" stroke-width="2"><animate attributeName="r" values="12;30" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#fff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600">
    <g transform="translate(704 318)"><rect x="-8" y="-17" width="104" height="26" rx="13" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".2"/><text x="44" y="1" text-anchor="middle">Live flights</text></g>
    <g transform="translate(868 130)"><rect x="-8" y="-17" width="120" height="26" rx="13" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".2"/><text x="52" y="1" text-anchor="middle">Real places</text></g>
    <g transform="translate(1020 304)"><rect x="-8" y="-17" width="150" height="26" rx="13" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".2"/><text x="67" y="1" text-anchor="middle">Weather &amp; air quality</text></g>
  </g>
  <g><path d="M-6 -6 L22 0 L-6 6 L-2 0 Z" fill="#fff"/><path d="M-2 0 L22 0 L-6 -6 Z" fill="#ffd9d0"/><animateMotion dur="7s" repeatCount="indefinite" rotate="auto" path="M690 292 C 800 292, 830 150, 940 170 S 1090 280, 1196 96"/></g>

  <!-- logo + wordmark -->
  <g transform="translate(72 96)" filter="url(#shadow)"><rect width="84" height="84" rx="24" fill="url(#logo)"/>
    <path d="M18 43 L66 20 L52 64 L42 47 Z" fill="#fff"/><path d="M42 47 L66 20 L24 38 Z" fill="#ffe3db"/></g>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="180" y="150" font-size="74" font-weight="800" fill="#fff" letter-spacing="-2">Plarno<tspan fill="url(#word)">.ai</tspan></text>
    <text x="184" y="196" font-size="26" fill="#fff" fill-opacity=".82">Your journey, <tspan font-family="Georgia,'Times New Roman',serif" font-style="italic" fill="#ff9a78">intelligently</tspan> planned.</text>
    <text x="184" y="242" font-size="16" fill="#fff" fill-opacity=".55" letter-spacing=".3">An agentic travel planner · real places, hotels, flights and live weather · a 3D companion named TRIP</text>
  </g>
</svg>
